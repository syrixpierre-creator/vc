name: queen-akuma
services:
  - name: queen-akuma
    type: web
    regions: [fra]
    ports:
      - port: 5000
        protocol: http
    routes:
      - path: /
    scalings:
      - min: 1
        max: 1
    env:
      - key: NODE_ENV
        value: production
    docker:
      dockerfile: Dockerfile
