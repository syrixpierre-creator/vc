# Local development: only PostgreSQL and Redis, reachable from this computer only (127.0.0.1).
#   docker compose -f docker-compose.dev.yml up -d
#   cd server && npm install && DATABASE_URL=postgres://postgres:dev@127.0.0.1:5432/syrix_dev node src/dev.ts
name: syrix-vcf-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: syrix_dev }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [devpg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  devpg:
